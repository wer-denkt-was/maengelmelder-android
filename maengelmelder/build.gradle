apply plugin: 'com.android.library'
apply plugin: 'org.owasp.dependencycheck'
apply plugin: 'maven-publish'

ext.gmapApiKey = project.findProperty('default_google_map_apikey') ?: ''

android {
    namespace "de.maengelmelder.mainmodule"

    defaultConfig {
        compileSdkVersion 36
        flavorDimensions [ "default" ]
        minSdkVersion 23
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "debug", "true"
            buildConfigField 'int', 'VERSION_CODE', "30"
            resValue 'string', 'gmap_api_key', gmapApiKey
        }
        release {
            buildConfigField "boolean", "debug", "false"
            buildConfigField 'int', 'VERSION_CODE', "30"
            /**
             *
             * In your local environment,
             * the key "default_google_map_apikey" is set in ~/.gradle/gradle.properties
             */
            resValue 'string', 'gmap_api_key', gmapApiKey
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    publishing {
        singleVariant('release')
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LGPL2.1', 'META-INF/NOTICE', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt']
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
        resValues true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // Enable unit tests to return mocked objects instead of actual objects (e.g. JSONObject)
        unitTests.returnDefaultValues = true
        targetSdk 36
    }
    lint {
        targetSdk 36
    }

}

dependencyCheck {
    format("JUNIT")
    skipTestGroups true
    suppressionFile = 'owasp_suppression.xml'
    skipConfigurations = ['debugAndroidTestRuntimeClasspath']
}

configurations.all {exclude group: 'com.android.support', module: 'support-v4' }

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    /*
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    */
    // Unit test
    testImplementation 'junit:junit:4.13.2'
    // Mock JSON object
    testImplementation 'org.json:json:20231013'
    // Espresso
    androidTestImplementation('androidx.test.espresso:espresso-core:3.6.1')
    androidTestImplementation("androidx.test.espresso:espresso-intents:3.6.1")
    androidTestImplementation('androidx.test.espresso:espresso-accessibility:3.6.1')
    androidTestImplementation('androidx.test.ext:junit:1.2.1')
    androidTestImplementation('androidx.test:runner:1.6.1')
    androidTestImplementation('androidx.test:rules:1.6.1')

    api 'androidx.core:core-ktx:1.18.0'
    api 'androidx.appcompat:appcompat:1.7.1'
    api 'androidx.cardview:cardview:1.0.0'
    api 'com.google.android.material:material:1.13.0'
    api 'com.jsibbold:zoomage:1.3.1'
    // Preference
    api 'androidx.preference:preference-ktx:1.2.1'
    // GSON
    api 'com.google.code.gson:gson:2.14.0'
    // Constraint layout
    api 'androidx.constraintlayout:constraintlayout:2.2.1'
    // Swipe refresh layout
    api "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    // OkHttp network lib
    api 'com.squareup.okhttp3:okhttp:4.12.0'
    // Viewpager indicator
    api 'androidx.viewpager:viewpager:1.1.0'
    api 'me.relex:circleindicator:2.1.6'
    // Recyclerview
    api "androidx.recyclerview:recyclerview:1.4.0"
    // Showcase tutorial overlay
    api 'com.github.erkutaras:ShowcaseView:1.5.0'

    // Kotlin coroutines
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    api "androidx.lifecycle:lifecycle-extensions:2.2.0"

    // network interceptor
    api 'com.facebook.stetho:stetho:1.5.1'
    api 'com.facebook.stetho:stetho-okhttp3:1.5.1'

    // Custom fonts
    api 'io.github.inflationx:calligraphy3:3.1.1'
    api 'io.github.inflationx:viewpump:2.0.3'

    // Code scanner
    api 'com.google.android.gms:play-services-code-scanner:16.1.0'

    api 'com.google.android.gms:play-services-maps:20.0.0'
    api 'com.google.android.gms:play-services-location:21.3.0'
    api 'com.google.maps.android:android-maps-utils:4.3.0'

    api 'com.squareup.picasso:picasso:2.71828'
    api 'androidx.exifinterface:exifinterface:1.4.2'
}

repositories {
    mavenCentral()
maven { url 'https://jitpack.io' }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = project.group
                artifactId = 'maengelmelder'
                version = project.version
            }
        }
    }
}